<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>HMB Agency | Thầu xây dựng & Thiết kế</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      overflow-x: hidden;
      font-size: 16px;
    }

    #app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    /* ============ HEADER ============ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #e2e8f0;
      gap: 16px;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      padding: 6px 8px;
      margin: -6px -8px;
      border-radius: 12px;
      transition: background 0.2s, transform 0.2s;
      user-select: none;
      -webkit-user-select: none;
    }

    .logo:hover { background: #eef2f6; }
    .logo:active { transform: scale(0.97); }

    .logo-icon {
      background: #1e3a5f;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .logo:hover .logo-icon { background: #0f2a44; }

    .logo-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1e3a5f;
      line-height: 1.1;
      transition: color 0.2s;
    }

    .logo-text span {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .menu-toggle {
      display: none;
      background: #1e3a5f;
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .menu-toggle:hover { background: #0f2a44; }
    .menu-toggle:active { transform: scale(0.95); }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #334155;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 40px;
      transition: all 0.2s;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-height: 44px;
    }

    nav a i { font-size: 14px; }
    nav a:hover { background: #eef2f6; color: #1e3a5f; }
    nav a.active { background: #1e3a5f; color: white; }

    /* ============ MAIN ============ */
    main {
      min-height: 70vh;
      padding: 32px 0;
    }

    .page { animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ HERO ============ */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      margin-bottom: 48px;
    }

    .hero-content h2 {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #0f172a;
      margin-bottom: 20px;
    }

    .hero-content h2 span {
      color: #1e3a5f;
      border-bottom: 4px solid #fbbf24;
    }

    .hero-content p {
      font-size: 17px;
      color: #475569;
      margin-bottom: 28px;
      max-width: 500px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1e3a5f;
      color: white;
      padding: 14px 26px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(30, 58, 95, 0.15);
      min-height: 48px;
      font-family: inherit;
    }

    .btn:hover {
      background: #0f2a44;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 58, 95, 0.2);
    }

    .btn:active { transform: translateY(0); }

    .btn-outline {
      background: transparent;
      color: #1e3a5f;
      border: 2px solid #1e3a5f;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: #1e3a5f;
      color: white;
    }

    .hero-image {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      height: 400px;
      background: #cbd5e1;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    /* ============ STATS ============ */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin: 48px 0;
    }

    .stat-item {
      background: white;
      padding: 26px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      border: 1px solid #e9eef3;
    }

    .stat-number {
      font-size: 36px;
      font-weight: 700;
      color: #1e3a5f;
    }

    .stat-label {
      color: #64748b;
      font-weight: 500;
      margin-top: 6px;
      font-size: 14px;
    }

    /* ============ SECTION ============ */
    .section-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .section-sub {
      color: #64748b;
      font-size: 17px;
      margin-bottom: 40px;
      max-width: 600px;
    }

    /* ============ SERVICES ============ */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 26px;
      margin-bottom: 48px;
    }

    .service-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      border: 1px solid #e9eef3;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 40px -12px rgba(30, 58, 95, 0.25);
    }

    .service-img {
      height: 200px;
      background: #d9e2ec;
      overflow: hidden;
    }

    .service-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .service-content {
      padding: 24px;
      flex: 1;
    }

    .service-content i {
      font-size: 26px;
      color: #1e3a5f;
      margin-bottom: 14px;
    }

    .service-content h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .service-content p {
      color: #475569;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ============ PROJECTS ============ */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
      margin-bottom: 48px;
    }

    .project-item {
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      height: 320px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      cursor: pointer;
    }

    .project-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 40px -12px rgba(30, 58, 95, 0.3);
    }

    .project-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s;
    }

    .project-item:hover img { transform: scale(1.05); }

    .project-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      padding: 22px 18px 18px;
      color: white;
    }

    .project-overlay h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .project-overlay p {
      font-size: 13px;
      opacity: 0.9;
    }

    /* ============ TRANG CHI TIẾT ============ */
    .detail-page {
      max-width: 900px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: #1e3a5f;
      border: 1.5px solid #e2e8f0;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
      min-height: 44px;
      font-family: inherit;
      text-decoration: none;
    }

    .back-btn:hover {
      background: #1e3a5f;
      color: white;
      border-color: #1e3a5f;
    }

    .back-btn:active { transform: scale(0.97); }

    .detail-hero {
      border-radius: 28px;
      overflow: hidden;
      height: 400px;
      background: #cbd5e1;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }

    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 5 ẢNH NHỎ DƯỚI ẢNH CHÍNH ===== */
    .detail-thumbs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .detail-thumb {
      border-radius: 14px;
      overflow: hidden;
      height: 80px;
      background: #d9e2ec;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .detail-thumb:hover {
      border-color: #1e3a5f;
      transform: translateY(-2px);
    }

    .detail-thumb.active {
      border-color: #1e3a5f;
      box-shadow: 0 6px 16px rgba(30, 58, 95, 0.25);
    }

    .detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-tag {
      display: inline-block;
      background: #eef2f6;
      color: #1e3a5f;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 40px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .detail-title {
      font-size: 38px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      letter-spacing: -0.8px;
      line-height: 1.2;
    }

    .detail-body p {
      color: #475569;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .detail-body ul {
      list-style: none;
      margin: 20px 0 28px;
      padding: 0;
    }

    .detail-body ul li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      color: #334155;
      font-size: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .detail-body ul li:last-child { border-bottom: none; }

    .detail-body ul li i {
      color: #1e3a5f;
      font-size: 16px;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid #e2e8f0;
    }

    /* ============ CONTACT ============ */
    .contact-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin: 32px 0;
      align-items: start;
    }

    .contact-info {
      background: white;
      padding: 32px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid #e9eef3;
    }

    .contact-info h2 {
      font-size: 24px;
      margin-bottom: 22px;
      color: #0f172a;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 18px;
      transition: all 0.2s;
    }

    .contact-detail:hover { background: #eef2f6; }

    .contact-detail i {
      font-size: 22px;
      color: #1e3a5f;
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .contact-detail .label {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .contact-detail .value {
      font-weight: 600;
      color: #0f172a;
      font-size: 15px;
      word-break: break-word;
    }

    .contact-map {
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      min-height: 300px;
      background: #cbd5e1;
      margin-top: 24px;
    }

    .contact-map img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ============ FORM LIÊN HỆ ============ */
    .contact-form-wrapper {
      background: white;
      padding: 32px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid #e9eef3;
    }

    .contact-form-wrapper h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .contact-form-wrapper .form-sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group label .required {
      color: #dc2626;
      margin-left: 2px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      color: #0f172a;
      background: #f8fafc;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #1e3a5f;
      background: white;
      box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-group select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e3a5f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 18px;
      padding-right: 40px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-submit {
      width: 100%;
      margin-top: 8px;
    }

    .form-success {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 18px;
      border: 1px solid #86efac;
      align-items: center;
      gap: 8px;
    }

    .form-success.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    /* ============ FOOTER ============ */
    footer {
      margin-top: 48px;
      padding: 32px 0 20px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      color: #64748b;
      font-size: 14px;
    }

    .footer-hotline {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-hotline a {
      color: #1e3a5f;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ============ TABLET ============ */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 32px;
      }
      .hero-content p {
        margin-left: auto;
        margin-right: auto;
      }
      .hero-image { height: 320px; }
      .stats { grid-template-columns: 1fr; gap: 16px; }
      .contact-layout { grid-template-columns: 1fr; gap: 24px; }
      .section-title { font-size: 30px; }
      .hero-content h2 { font-size: 36px; }
      .detail-hero { height: 320px; }
      .detail-title { font-size: 30px; }
    }

    /* ============ MOBILE ============ */
    @media (max-width: 768px) {
      #app { padding: 0 16px 32px; }

      header {
        flex-wrap: wrap;
        padding: 12px 0;
        gap: 12px;
      }

      .menu-toggle { display: flex; }

      .logo-text h1 { font-size: 18px; }
      .logo-text span { font-size: 10px; }

      nav {
        width: 100%;
        flex-direction: column;
        gap: 4px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease, padding 0.3s ease;
        background: white;
        border-radius: 16px;
        padding: 0;
        order: 3;
      }

      nav.open {
        max-height: 400px;
        padding: 8px;
        margin-top: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #e9eef3;
      }

      nav a {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        font-size: 15px;
        justify-content: flex-start;
      }

      nav a i { width: 20px; }

      .hero-content h2 { font-size: 28px; letter-spacing: -0.5px; }
      .hero-content p { font-size: 15px; margin-bottom: 24px; }
      .hero-image { height: 240px; border-radius: 20px; }
      .section-title { font-size: 26px; }
      .section-sub { font-size: 15px; margin-bottom: 28px; }

      .hero .btn { width: 100%; }
      .hero > .hero-content > div { flex-direction: column; }

      .stat-item { padding: 20px 16px; }
      .stat-number { font-size: 30px; }

      /* DỊCH VỤ: 2 thẻ 1 hàng */
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .service-img { height: 110px; }
      .service-content { padding: 14px; }
      .service-content i { font-size: 20px; margin-bottom: 8px; }
      .service-content h3 { font-size: 14px; margin-bottom: 6px; line-height: 1.3; }
      .service-content p { font-size: 12px; line-height: 1.5; }

      /* ===== DỰ ÁN MOBILE: SO LE 2 BÊN, MỖI ẢNH 60% ===== */
      .projects-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 40px;
      }

      .project-item {
        width: 60%;
        height: 220px;
      }

      /* Các thẻ lẻ (1, 3, 5...) nằm bên trái */
      .project-item:nth-child(odd) {
        align-self: flex-start;
        margin-left: 0;
      }

      /* Các thẻ chẵn (2, 4, 6...) nằm bên phải */
      .project-item:nth-child(even) {
        align-self: flex-end;
        margin-right: 0;
      }

      /* ===== TRANG CHI TIẾT DỰ ÁN MOBILE ===== */
      .detail-hero { height: 200px; border-radius: 20px; margin-bottom: 12px; }

      .detail-thumbs {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 22px;
      }

      .detail-thumb {
        height: 48px;
        border-radius: 8px;
      }

      .detail-title { font-size: 24px; margin-bottom: 16px; }
      .detail-body p { font-size: 15px; }
      .detail-body ul li { font-size: 15px; }
      .detail-actions { flex-direction: column; }
      .detail-actions .btn { width: 100%; }
      .back-btn { padding: 10px 16px; font-size: 13px; }

      /* Liên hệ */
      .contact-info { padding: 22px; border-radius: 22px; }
      .contact-info h2 { font-size: 20px; }
      .contact-detail { padding: 12px; gap: 12px; }
      .contact-detail i { font-size: 18px; width: 32px; }
      .contact-detail .value { font-size: 14px; }
      .contact-map { min-height: 200px; border-radius: 22px; }

      .contact-form-wrapper { padding: 22px; border-radius: 22px; }
      .contact-form-wrapper h2 { font-size: 20px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }

      footer {
        flex-direction: column;
        text-align: center;
        gap: 12px;
        padding: 24px 0 16px;
        font-size: 13px;
      }

    // ====== DOM ======
    const mainContent = document.getElementById('main-content');
    const mainNav = document.getElementById('main-nav');
    const menuToggle = document.getElementById('menuToggle');
    const logoBtn = document.getElementById('logoBtn');

    // ====== MENU ======
    function closeMenu() {
      mainNav.classList.remove('open');
      menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
    }

    function goHome() {
      if (window.location.hash === '#home' || window.location.hash === '') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        window.location.hash = 'home';
      }
      closeMenu();
    }

    logoBtn.addEventListener('click', goHome);
    logoBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        goHome();
      }
    });

    // ====== TẠO TRANG CHI TIẾT ======
    function buildDetailPage(id) {
      const data = detailData[id];
      if (!data) return pages.home;

      // Kiểm tra có phải dự án không (prefix pj-)
      const isProject = id.startsWith('pj-');
      // 5 ảnh nhỏ: ảnh chính + 4 ảnh đầu trong gallery (dùng lại)
      const thumbImages = isProject
        ? [data.img, ...galleryImages.slice(0, 4)]
        : [data.img, ...galleryImages.slice(0, 4)];

      const thumbsHTML = thumbImages.map((img, index) => `
        <div class="detail-thumb ${index === 0 ? 'active' : ''}" data-thumb-index="${index}">
          <img src="${img}" alt="Ảnh ${index + 1}">
        </div>
      `).join('');

      return `
        <div class="page detail-page">
          <a href="#" class="back-btn" id="backBtn">
            <i class="fas fa-arrow-left"></i> Quay lại
          </a>

          <div class="detail-hero">
            <img id="detailHeroImg" src="${data.img}" alt="${data.title}">
          </div>

          <div class="detail-thumbs" id="detailThumbs">
            ${thumbsHTML}
          </div>

          <span class="detail-tag">${data.tag}</span>
          <h1 class="detail-title">${data.title}</h1>

          <div class="detail-body">
            ${data.content}
          </div>

          <div class="detail-actions">
            <a href="tel:0855555140" class="btn"><i class="fas fa-phone-alt"></i> Gọi tư vấn: 0855 555 140</a>
            <a href="#" class="btn btn-outline" data-page-link="contact"><i class="fas fa-paper-plane"></i> Gửi yêu cầu</a>
          </div>
        </div>
      `;
    }

    // ====== GẮN SỰ KIỆN CHO 5 ẢNH NHỎ (CLICK ĐỔI ẢNH CHÍNH) ======
    function bindThumbnails() {
      const thumbs = document.querySelectorAll('.detail-thumb');
      const heroImg = document.getElementById('detailHeroImg');
      if (!heroImg || !thumbs.length) return;

      thumbs.forEach(thumb => {
        thumb.addEventListener('click', () => {
          const imgSrc = thumb.querySelector('img').src;
          heroImg.src = imgSrc;

          thumbs.forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        });
      });
    }

    // ====== XỬ LÝ FORM LIÊN HỆ ======
    function bindContactForm() {
      const form = document.getElementById('contactForm');
      if (!form) return;

      const successBox = document.getElementById('formSuccess');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const fullName = form.fullName.value.trim();
        const phone = form.phone.value.trim();

        if (!fullName) {
          alert('Vui lòng nhập họ và tên.');
          form.fullName.focus();
          return;
        }
        if (!phone) {
          alert('Vui lòng nhập số điện thoại.');
          form.phone.focus();
          return;
        }

        successBox.classList.add('show');
        form.reset();

        setTimeout(() => {
          successBox.classList.remove('show');
        }, 6000);

        successBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }

    // ====== GẮN SỰ KIỆN CHO THẺ CÓ data-detail ======
    function bindDetailTriggers() {
      document.querySelectorAll('[data-detail]').forEach(card => {
        card.addEventListener('click', () => {
          window.location.hash = 'detail-' + card.dataset.detail;
        });
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.location.hash = 'detail-' + card.dataset.detail;
          }
        });
      });
    }

    // ====== GẮN NÚT QUAY LẠI ======
    function bindBackButton() {
      const backBtn = document.getElementById('backBtn');
      if (!backBtn) return;

      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.hash = 'home';
        }
      });
    }

    // ====== RENDER ======
    function renderPage() {
      const hash = window.location.hash.substring(1) || 'home';

      let pageContent;
      let activePage = hash;

      if (hash.startsWith('detail-')) {
        const detailId = hash.replace('detail-', '');
        pageContent = buildDetailPage(detailId);

        if (detailId.startsWith('why-')) activePage = 'home';
        else if (detailId.startsWith('sv-')) activePage = 'services';
        else if (detailId.startsWith('pj-')) activePage = 'projects';
      } else {
        pageContent = pages[hash] || pages.home;
      }

      mainContent.innerHTML = pageContent;

      document.querySelectorAll('#main-nav a').forEach(link => {
        link.classList.remove('active');
        if (link.dataset.page === activePage) {
          link.classList.add('active');
        }
      });

      document.querySelectorAll('[data-page-link]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const page = btn.dataset.pageLink;
          window.location.hash = page;
          closeMenu();
        });
      });

      bindDetailTriggers();
      bindContactForm();
      bindBackButton();
      bindThumbnails();

      closeMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ====== EVENT LISTENERS ======
    menuToggle.addEventListener('click', () => {
      const isOpen = mainNav.classList.toggle('open');
      menuToggle.innerHTML = isOpen
        ? '<i class="fas fa-times"></i>'
        : '<i class="fas fa-bars"></i>';
    });

    document.querySelectorAll('#main-nav a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        window.location.hash = page;
        closeMenu();
      });
    });

    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768) {
        if (!mainNav.contains(e.target) && !menuToggle.contains(e.target)) {
          closeMenu();
        }
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768) closeMenu();
    });

    window.addEventListener('hashchange', renderPage);

    if (!window.location.hash) {
      window.location.hash = 'home';
    } else {
      renderPage();
    }

    window.addEventListener('load', renderPage);
  </script>
